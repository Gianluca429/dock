<header class="navbar">
  <div class="navbar__inner page-shell">
    <a
      class="navbar__brand"
      routerLink="/"
      aria-label="DOCK home"
      (click)="closeMenu()"
    >
      DOCK<span>.</span>
    </a>

    <nav class="navbar__links" aria-label="Navigazione principale">
      <a
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Home
      </a>

      <a routerLink="/shop" routerLinkActive="is-active">
        Shop
      </a>

      <a routerLink="/workspace" routerLinkActive="is-active">
        Workspace
      </a>

      <a routerLink="/audio" routerLinkActive="is-active">
        Audio
      </a>

      <a routerLink="/power" routerLinkActive="is-active">
        Power
      </a>
    </nav>

    <div class="navbar__actions">
      <button class="icon-button icon-button--search" type="button" aria-label="Cerca">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5"></circle>
          <path d="M16 16 21 21"></path>
        </svg>
      </button>

      <button class="icon-button icon-button--desktop" type="button" aria-label="Wishlist">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"></path>
        </svg>
      </button>

      <button
        class="menu-button"
        [class.is-open]="menuOpen()"
        type="button"
        aria-label="Apri menu"
        aria-controls="mobile-navigation"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        <span></span>
        <span></span>
      </button>

      <button
        class="cart-button"
        type="button"
        routerLink="/cart"
        [attr.aria-label]="
          'Carrello, ' +
          cart.itemCount() +
          (cart.itemCount() === 1 ? ' prodotto' : ' prodotti')
        "
        (click)="closeMenu()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 4h2l2.2 10.1a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 1.9-1.4L21 7H6"></path>
          <circle cx="10" cy="20" r="1"></circle>
          <circle cx="18" cy="20" r="1"></circle>
        </svg>

        <span class="cart-button__count">
          {{ cart.itemCount() }}
        </span>
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <nav
      id="mobile-navigation"
      class="navbar__mobile-menu"
      aria-label="Navigazione mobile"
    >
      <div class="navbar__mobile-menu-inner page-shell">
        <a
          routerLink="/"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMenu()"
        >
          Home
          <span aria-hidden="true">↗</span>
        </a>

        <a routerLink="/shop" routerLinkActive="is-active" (click)="closeMenu()">
          Shop
          <span aria-hidden="true">↗</span>
        </a>

        <a routerLink="/workspace" routerLinkActive="is-active" (click)="closeMenu()">
          Workspace
          <span aria-hidden="true">↗</span>
        </a>

        <a routerLink="/audio" routerLinkActive="is-active" (click)="closeMenu()">
          Audio
          <span aria-hidden="true">↗</span>
        </a>

        <a routerLink="/power" routerLinkActive="is-active" (click)="closeMenu()">
          Power
          <span aria-hidden="true">↗</span>
        </a>
      </div>
    </nav>
  }
</header>
